name: CI
on:
  pull_request:
  push:
      branches: ["release"]

jobs:
  check:
    runs-on: [self-hosted, nix]
    steps:
      - uses: actions/checkout@v2

      - name: Check Nix flake
        run: nix flake check -L

  deploy:
    runs-on: [self-hosted, nix]
    if: github.ref == 'refs/heads/release'
    needs: [check]
    steps:
      - uses: actions/checkout@v2

      - name: Deploy
        run: nix shell .#deploy-rs -c deploy -s
